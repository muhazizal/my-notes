name: Automated Testing

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  automated-testing:
    name: Automated Testing
    runs-on: ubuntu-latest

    steps:
      # 🧾 Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # ⚙️ Setup Node & cache deps
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # 📦 Install dependencies
      - name: Install dependencies
        run: npm ci

      # 🧪 Run unit + integration tests first (Vitest)
      - name: Run Vitest with coverage
        run: npm run test:coverage

      # 📊 Upload Vitest coverage (HTML report)
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage

      # 🏗️ Build the app (ensures it compiles fine)
      - name: Build Nuxt app
        run: npm run build

      # 🚀 Start the preview server in background
      - name: Start preview server
        run: |
          npm run preview -- --port=3000 &
          npx wait-on http://localhost:3000
        env:
          NITRO_PORT: 3000

      # 🌐 Install Playwright dependencies
      - name: Install Playwright browsers and OS deps
        run: npx playwright install --with-deps

      # 🎭 Run E2E tests (Playwright)
      - name: Run Playwright E2E tests
        env:
          NUXT_API_BASE_URL: http://localhost:3000
        run: npx playwright test --reporter=line --reporter=html

      # 📁 Upload Playwright HTML report
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      # 🧩 Upload raw test-results if E2E fails
      - name: Upload raw Playwright test-results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results
          if-no-files-found: ignore
